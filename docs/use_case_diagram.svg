<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 840" width="960" height="840" font-family="Arial, sans-serif">

  <!-- Background -->
  <rect width="960" height="840" fill="#ffffff"/>

  <!-- ═══ SYSTEM BOUNDARY ═══ -->
  <rect x="145" y="50" width="650" height="775" fill="#f9fafb" stroke="#374151" stroke-width="2" rx="4"/>
  <text x="470" y="78" text-anchor="middle" font-size="17" font-weight="bold" fill="#111827">Il Vento System</text>

  <!-- ═══ USE CASES (rx=150, font-size=15) ═══ -->

  <!-- UC1: Login / Logout -->
  <ellipse cx="470" cy="115" rx="150" ry="22" fill="#bfdbfe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="470" y="120" text-anchor="middle" font-size="15" fill="#1e3a5f">Login / Logout</text>

  <!-- UC2: View Inventory -->
  <ellipse cx="470" cy="180" rx="150" ry="22" fill="#bfdbfe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="470" y="185" text-anchor="middle" font-size="15" fill="#1e3a5f">View Inventory</text>

  <!-- UC3: Adjust Stock -->
  <ellipse cx="470" cy="245" rx="150" ry="22" fill="#bfdbfe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="470" y="250" text-anchor="middle" font-size="15" fill="#1e3a5f">Adjust Stock</text>

  <!-- UC4: Create Transaction -->
  <ellipse cx="470" cy="310" rx="150" ry="22" fill="#bfdbfe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="470" y="315" text-anchor="middle" font-size="15" fill="#1e3a5f">Create Transaction</text>

  <!-- UC5: Finalize Own Transaction -->
  <ellipse cx="470" cy="375" rx="150" ry="22" fill="#bfdbfe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="470" y="380" text-anchor="middle" font-size="15" fill="#1e3a5f">Finalize Own Transaction</text>

  <!-- UC6: Manage Products and Categories -->
  <ellipse cx="470" cy="440" rx="150" ry="22" fill="#bfdbfe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="470" y="445" text-anchor="middle" font-size="15" fill="#1e3a5f">Manage Products and Categories</text>

  <!-- UC7: View All Transactions and Stats -->
  <ellipse cx="470" cy="505" rx="150" ry="22" fill="#bfdbfe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="470" y="510" text-anchor="middle" font-size="15" fill="#1e3a5f">View All Transactions and Stats</text>

  <!-- UC8: Export Reports -->
  <ellipse cx="470" cy="570" rx="150" ry="22" fill="#bfdbfe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="470" y="575" text-anchor="middle" font-size="15" fill="#1e3a5f">Export Reports</text>

  <!-- UC9: Send Admin Request -->
  <ellipse cx="470" cy="635" rx="150" ry="22" fill="#bfdbfe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="470" y="640" text-anchor="middle" font-size="15" fill="#1e3a5f">Send Admin Request</text>

  <!-- UC10: Manage Users -->
  <ellipse cx="470" cy="700" rx="150" ry="22" fill="#bfdbfe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="470" y="705" text-anchor="middle" font-size="15" fill="#1e3a5f">Manage Users</text>

  <!-- UC11: Export Audit Log -->
  <ellipse cx="470" cy="765" rx="150" ry="22" fill="#bfdbfe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="470" y="770" text-anchor="middle" font-size="15" fill="#1e3a5f">Export Audit Log</text>

  <!-- ═══ ASSOCIATION LINES ═══ -->

  <!-- Staff lines — blue #2563eb (left edge x=320) -->
  <line x1="92" y1="238" x2="320" y2="115" stroke="#2563eb" stroke-width="1.4"/>
  <line x1="92" y1="238" x2="320" y2="180" stroke="#2563eb" stroke-width="1.4"/>
  <line x1="92" y1="238" x2="320" y2="245" stroke="#2563eb" stroke-width="1.4"/>
  <line x1="92" y1="238" x2="320" y2="310" stroke="#2563eb" stroke-width="1.4"/>
  <line x1="92" y1="238" x2="320" y2="375" stroke="#2563eb" stroke-width="1.4"/>

  <!-- Manager lines — amber #d97706 (left edge x=320) -->
  <line x1="92" y1="518" x2="320" y2="115" stroke="#d97706" stroke-width="1.4"/>
  <line x1="92" y1="518" x2="320" y2="180" stroke="#d97706" stroke-width="1.4"/>
  <line x1="92" y1="518" x2="320" y2="245" stroke="#d97706" stroke-width="1.4"/>
  <line x1="92" y1="518" x2="320" y2="310" stroke="#d97706" stroke-width="1.4"/>
  <line x1="92" y1="518" x2="320" y2="375" stroke="#d97706" stroke-width="1.4"/>
  <line x1="92" y1="518" x2="320" y2="440" stroke="#d97706" stroke-width="1.4"/>
  <line x1="92" y1="518" x2="320" y2="505" stroke="#d97706" stroke-width="1.4"/>
  <line x1="92" y1="518" x2="320" y2="570" stroke="#d97706" stroke-width="1.4"/>
  <line x1="92" y1="518" x2="320" y2="635" stroke="#d97706" stroke-width="1.4"/>

  <!-- Admin lines — purple #7c3aed (right edge x=620) -->
  <line x1="863" y1="478" x2="620" y2="115" stroke="#7c3aed" stroke-width="1.4"/>
  <line x1="863" y1="478" x2="620" y2="440" stroke="#7c3aed" stroke-width="1.4"/>
  <line x1="863" y1="478" x2="620" y2="505" stroke="#7c3aed" stroke-width="1.4"/>
  <line x1="863" y1="478" x2="620" y2="570" stroke="#7c3aed" stroke-width="1.4"/>
  <line x1="863" y1="478" x2="620" y2="700" stroke="#7c3aed" stroke-width="1.4"/>
  <line x1="863" y1="478" x2="620" y2="765" stroke="#7c3aed" stroke-width="1.4"/>

  <!-- ═══ ACTOR STICK FIGURES ═══ -->

  <!-- Staff — blue #2563eb -->
  <circle cx="70" cy="210" r="14" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <line x1="70" y1="224" x2="70" y2="252" stroke="#2563eb" stroke-width="1.5"/>
  <line x1="48" y1="237" x2="92" y2="237" stroke="#2563eb" stroke-width="1.5"/>
  <line x1="70" y1="252" x2="55" y2="274" stroke="#2563eb" stroke-width="1.5"/>
  <line x1="70" y1="252" x2="85" y2="274" stroke="#2563eb" stroke-width="1.5"/>
  <text x="70" y="292" text-anchor="middle" font-size="15" font-weight="bold" fill="#2563eb">Staff</text>

  <!-- Manager — amber #d97706 -->
  <circle cx="70" cy="490" r="14" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <line x1="70" y1="504" x2="70" y2="532" stroke="#d97706" stroke-width="1.5"/>
  <line x1="48" y1="517" x2="92" y2="517" stroke="#d97706" stroke-width="1.5"/>
  <line x1="70" y1="532" x2="55" y2="554" stroke="#d97706" stroke-width="1.5"/>
  <line x1="70" y1="532" x2="85" y2="554" stroke="#d97706" stroke-width="1.5"/>
  <text x="70" y="572" text-anchor="middle" font-size="15" font-weight="bold" fill="#d97706">Manager</text>

  <!-- Admin — purple #7c3aed -->
  <circle cx="885" cy="450" r="14" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <line x1="885" y1="464" x2="885" y2="492" stroke="#7c3aed" stroke-width="1.5"/>
  <line x1="863" y1="477" x2="907" y2="477" stroke="#7c3aed" stroke-width="1.5"/>
  <line x1="885" y1="492" x2="870" y2="514" stroke="#7c3aed" stroke-width="1.5"/>
  <line x1="885" y1="492" x2="900" y2="514" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="885" y="532" text-anchor="middle" font-size="15" font-weight="bold" fill="#7c3aed">Admin</text>

</svg>
